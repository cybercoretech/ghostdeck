name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Privacy gate and charter self-tests
        run: |
          bash tools/tests/test-privacy-gate.sh
          bash tools/tests/test-charter-sync.sh
      - name: Build, test, lint
        run: ./gradlew assembleDebug testDebugUnitTest lint assembleRelease
      - name: Privacy gate (release APK)
        run: tools/privacy-gate.sh apk app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Privacy gate (dependencies)
        run: tools/privacy-gate.sh gradle
      - uses: actions/upload-artifact@v7
        with:
          name: ghostdeck-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
